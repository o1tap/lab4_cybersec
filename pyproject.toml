# Налаштування для лінтера Ruff
[tool.ruff]
line-length = 88         # Максимальна довжина рядка коду (стандарт PEP8)
target-version = "py312" # Версія Python

[tool.ruff.lint]
select = ["E", "F", "I", "UP"] # Перевіряти помилки синтаксису, імпорти та стиль

# Налаштування для аналізатора типів Mypy
[tool.mypy]
python_version = "3.12"
strict = true                   # Строгий режим перевірки типів
ignore_missing_imports = true   # Ігнорувати відсутність типів у зовнішніх бібліотеках